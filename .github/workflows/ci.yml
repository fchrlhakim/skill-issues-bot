name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Check code formatting (gofmt)
        run: gofmt -l . | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./... -count=1
      - name: Go build
        run: go build ./...
      - name: Migrations present
        run: |
          test -f migrations/postgres/000001_create_users.up.sql
          test -f migrations/postgres/000002_discord_marketplace.up.sql
          test -f deploy/be.Dockerfile
          test -f docker-compose.prod.yml
